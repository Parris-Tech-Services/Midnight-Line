name: Playwright browser journeys
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.cjs'
      - 'tests/browser/**'
      - 'tests/security/**'
      - '.github/workflows/playwright-browser.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.cjs'
      - 'tests/browser/**'
      - 'tests/security/**'
permissions:
  contents: read
jobs:
  browser:
    # Match the supported OS matrix of the pinned Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:security
      - run: npm run build
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
